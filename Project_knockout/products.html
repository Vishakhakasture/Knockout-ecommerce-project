<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Products - MyShop</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/products.css" />
  </head>

  <body>
    <div id="app">
      <!-- Your existing header -->

      <main class="products-page">
        <section class="products-section">
          <div class="container">
            <div class="section-title">
              <h1>All Products</h1>

              <p>Browse our electronics collection.</p>
            </div>

            <div class="product-grid" data-bind="foreach: products">
              <div class="product-card">
                <div class="product-image">
                  <img
                    data-bind="
                    attr: {
                      src: image,
                      alt: name
                    }
                  "
                  />
                </div>

                <div class="product-info">
                  <span
                    class="product-category"
                    data-bind="text: category"
                  ></span>

                  <h3 data-bind="text: name"></h3>

                  <p
                    class="product-description"
                    data-bind="text: description"
                  ></p>

                  <div class="product-bottom">
                    <span class="price">
                      $
                      <span data-bind="text: price"></span>
                    </span>

                    <div class="product-actions">
                      <button
                        class="btn secondary"
                        data-bind="click: $parent.viewProduct"
                      >
                        View
                      </button>

                      <button class="btn" data-bind="click: $parent.addToCart">
                        Add to Cart
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="node_modules/knockout/build/output/knockout-latest.js"></script>

    <script src="js/data/product_data.js"></script>

    <script src="js/cart.js"></script>

    <script src="js/viewmodels/productsViewModel.js"></script>
  </body>
</html>
