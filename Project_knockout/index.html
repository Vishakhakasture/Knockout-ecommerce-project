      <header-component></header-component>

      <section class="hero">
        <div class="container hero-content">
          <div class="hero-text">
            <h1>Welcome to MyShop</h1>

            <p>Discover amazing products at great prices.</p>

            <a href="products.html" class="btn"> Shop Now </a>
          </div>
        </div>
      </section>

      <section class="featured-products">
        <div class="container">
          <div class="section-title">
            <h2>Featured Products</h2>
            <p>Check out some of our popular products.</p>
          </div>

          <div class="product-grid" data-bind="foreach: home.featuredProducts">
            <div class="product-card">
              <div class="product-image">
                <img
                  data-bind="
              attr: {
                src: image,
                alt: name
              }
            "
                />
              </div>

              <div class="product-info">
                <span
                  class="product-category"
                  data-bind="text: category"
                ></span>

                <h3 data-bind="text: name"></h3>

                <p
                  class="product-description"
                  data-bind="text: description"
                ></p>

                <div class="product-bottom">
                  <span class="price">
                    $
                    <span data-bind="text: price"></span>
                  </span>

                  <div class="product-actions">
                    <button
                      class="btn secondary"
                      data-bind="
                  click: $parent.viewProduct
                "
                    >
                      View
                    </button>

                    <button
                      class="btn"
                      data-bind="
                  click: $parent.addToCart
                "
                    >
                      Add to Cart
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="view-all">
            <a href="products.html" class="btn secondary"> View All </a>
          </div>
        </div>
      </section>

      <footer-component></footer-component>
    </div>

    <script src="node_modules/knockout/build/output/knockout-latest.js"></script>

    <script src="js/components/header/headerViewModel.js"></script>

    <script src="js/components/componentLoader.js"></script>

    <script src="js/components/components.js"></script>

    <script src="js/data/product-data.js"></script>

    <script src="js/viewmodels/homeViewModel.js"></script>

    <script src="js/app.js"></script>
